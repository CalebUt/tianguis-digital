<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Tianguis Digital</title>
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <main>
    <h2>Catálogo de productos</h2>

    <div class="catalogo-layout">
      <aside class="filtros">
        <h3>Filtros</h3>
        <form id="formFiltros">
          <label for="filtroCategoria">Categoría</label>
          <select id="filtroCategoria">
            <option value="">Todas</option>
          </select>

          <label for="filtroPrecioMin">Precio mínimo</label>
          <input type="number" id="filtroPrecioMin" min="0" placeholder="0" />

          <label for="filtroPrecioMax">Precio máximo</label>
          <input type="number" id="filtroPrecioMax" min="0" placeholder="Sin límite" />

          <label for="filtroBuscar">Buscar por nombre</label>
          <input type="text" id="filtroBuscar" placeholder="Ej. laptop" />

          <button type="submit">Aplicar filtros</button>
        </form>
      </aside>

      <div class="productos-grid" id="listaProductos">Cargando productos...</div>
    </div>
  </main>

  <script src="../js/nav.js"></script>
  <script src="../js/catalogo.js"></script>
</body>
</html>
