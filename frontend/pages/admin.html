<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de administración — Tianguis Digital</title>
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <main>
  <h2>Panel de administración</h2>

  <div class="form-container" style="max-width:500px;">
    <h3 id="tituloFormProducto">Registrar producto</h3>
    <form id="formImagen">
      <input type="hidden" id="idProductoEditar" value="" />

      <label for="nombreProducto">Nombre</label>
      <input type="text" id="nombreProducto" required />

      <label for="descripcionProducto">Descripción</label>
      <input type="text" id="descripcionProducto" required />

      <label for="precioProducto">Precio (MXN)</label>
      <input type="number" id="precioProducto" min="0" step="0.01" required />

      <label for="existenciaProducto">Existencia</label>
      <input type="number" id="existenciaProducto" min="0" required />

      <label for="categoriaProducto">Categoría</label>
      <select id="categoriaProducto" required></select>

      <label for="productoSelect">Producto (para subir imagen)</label>
      <select id="productoSelect"></select>

      <label for="archivoImagen">Imagen (JPG, PNG o WEBP) — opcional</label>
      <input type="file" id="archivoImagen" accept="image/jpeg, image/png, image/webp" />

      <button type="submit" id="btnGuardarProducto">Guardar producto</button>
      <button type="button" id="btnCancelarEdicion" style="display:none; background:#888; margin-top:0.5rem;">Cancelar edición</button>
      <p id="mensajeProducto" class="mensaje-error"></p>
    </form>
  </div>

  <h3 style="margin-top:2rem;">Productos</h3>
  <table>
    <thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Existencia</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody id="cuerpoProductosAdmin"></tbody>
  </table>

  <h3 style="margin-top:2rem;">Pedidos</h3>
  <table>
    <thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead>
    <tbody id="cuerpoPedidosAdmin"></tbody>
  </table>
</main>

<script src="../js/nav.js"></script>
<script src="../js/carrito.js"></script>
<script src="../js/admin.js"></script>

</body>
</html>
