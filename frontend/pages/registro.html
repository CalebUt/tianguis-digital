<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta — Tianguis Digital</title>
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <main>
    <div class="form-container">
      <h2>Crear cuenta</h2>
      <form id="formRegistro">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required minlength="2" />

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" required minlength="2" />

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required />

        <label for="telefono">Teléfono (10 dígitos)</label>
        <input type="text" id="telefono" pattern="[0-9]{10}" maxlength="10" placeholder="3111234567" />

        <label for="password">Contraseña (mínimo 8 caracteres)</label>
        <input type="password" id="password" required minlength="8" />

        <button type="submit">Registrarme</button>
        <p id="mensajeRegistro" class="mensaje-error"></p>
      </form>
      <p style="margin-top:1rem; text-align:center;">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>
    </div>
  </main>

  <script src="../js/nav.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
